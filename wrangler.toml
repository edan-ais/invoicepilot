name = "invoicepilot"
main = "src/worker.js"
compatibility_date = "2026-10-15"

[assets]
directory = "./public"
binding = "ASSETS"

# KV namespace ids are filled in after `wrangler kv namespace create INVOICES`
[[kv_namespaces]]
binding = "INVOICES"
id = "2aafba4d1ae246a48524cf376ad767da"
preview_id = "974ddd76410a462e9787b91f08bf6f38"

[vars]
PAYPAL_MODE = "sandbox"
# Secrets (set with `wrangler secret put`): PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET, GEMINI_API_KEY
